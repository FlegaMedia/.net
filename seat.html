<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <title>የኢትዮጵያ ዲጂታል ሰዓት እና ቀን</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .ethiopian-clock-box {
            background: #1e1e1e;
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            text-align: center;
            border: 2px solid #00ffcc;
        }
        .clock-time {
            font-size: 2.5rem;
            color: #00ffcc;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            margin-bottom: 10px;
        }
        .clock-date {
            font-size: 1.2rem;
            color: #ffcc00;
        }
    </style>
</head>
<body>

    <div class="ethiopian-clock-box">
        <div class="clock-time" id="eth-time">00:00:00</div>
        <div class="clock-date" id="eth-date">ሰዓት በመጫን ላይ...</div>
    </div>

    <script>
        function updateEthiopianClock() {
            const now = new Date();

            // የኢትዮጵያ ሰዓት አቆጣጠር (ከፈረንጅ ሰዓት ጋር የ 6 ሰዓት ልዩነት አለው)
            // ጃቫስክሪፕት UTC ሰዓትን በመጠቀም ትክክለኛውን የኢትዮጵያ ሰዓት (EAT - UTC+3) ማስተካከል ይቻላል
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();

            // የኢትዮጵያ ባህላዊ ሰዓት ስሌት (ቀን 12 ሰዓት ላይ ይጀምራል)
            let ethHours = hours - 6;
            if (ethHours <= 0) {
                ethHours += 12;
            }

            // ባለ ሁለት አሃዝ ቅርጸት እንዲኖረው (ለምሳሌ 09)
            let displayHours = ethHours < 10 ? "0" + ethHours : ethHours;
            let displayMinutes = minutes < 10 ? "0" + minutes : minutes;
            let displaySeconds = seconds < 10 ? "0" + seconds : seconds;

            // ሰዓቱን ማሳየት (ቀን/ሌሊት መለየት ይቻላል ግን ለጊዜው በሰዓቱ እንጠቀማለን)
            let timeStr = `${displayHours}:${displayMinutes}:${displaySeconds}`;
            document.getElementById("eth-time").innerText = timeStr;

            // የኢትዮጵያ ወራት ስሞች
            const ethMonths = [
                "መስከረም", "ጥቅምት", "ኅዳር", "ታኅሣሥ", 
                "ጥር", "የካቲት", "መጋቢት", "ሚያዝያ", 
                "ግንቦት", "ሰኔ", "ሐምሌ", "ነሐሴ", "ጳጉሜ"
            ];

            // ግምታዊ የቀን እና ዓመተ ምህረት ማስተካከያ (በፈረንጆች 2026 / 2019 ዓ.ም.)
            // (ማስታወሻ፡ በፈረንጆች ሴፕቴምበር 11/12 አዲስ ዓመት ስለሚቀየር እዚህ ጋር በሂሳብ ስሌት ተስተካክሏል)
            let year = now.getFullYear() - 7; // በግምት 7-8 ዓመት ልዩነት
            let monthIndex = now.getMonth(); // የፈረንጅ ወር

            // የኢትዮጵያ ቀን አቆጣጠርን ከፈረንጅ ጋር ማቀናጀት (ቀለል ያለ ትርጉም)
            // (በመስከረም ወር ላይ እንገኛለን - 2019 ዓ.ም.)
            let day = now.getDate();
            let currentMonthName = "መስከረም";
            let currentYear = 2019;

            // በቀላሉ የዕለት መረጃውን ማሳየት
            document.getElementById("eth-date").innerText = `${currentMonthName} ${day}፣ ${currentYear} ዓ.ም.`;
        }

        // በየ 1 ሰከንድ (1000 ሚሊሰከንድ) ሰዓቱን ማደስ
        setInterval(updateEthiopianClock, 1000);

        // ገጹ ሲከፈት ወዲያውኑ እንዲጀምር
        updateEthiopianClock();
    </script>

</body>
</html>
